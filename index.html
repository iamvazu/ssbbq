<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#15110D" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Smoke Signal BBQ" />
<title>Smoke Signal BBQ — Order System</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------------- Design tokens ----------------
     Smoke Signal BBQ is a fixed dark, charcoal-and-ember identity by design
     (a lit grill at night), so the brand palette stays constant regardless
     of the viewer's system theme. Tokens are still centralized on :root and
     re-affirmed under the dark-scheme guards for forward compatibility. */
  :root{
    --bg:#140F0D;
    --surface:#1F1613;
    --surface-2:#2B1E19;
    --border:#3F2921;
    --border-soft:#2E1E18;
    --ember:#D92228; /* Rich bold BBQ red matching the logo */
    --ember-dark:#B0171C;
    --amber:#FF4D4F; /* Warm bright red/coral highlight */
    --sage:#4E9F76;
    --sage-dark:#3B7A5A;
    --wine:#991B1B;
    --text:#FBF5EE;
    --text-muted:#B8A394;
    --text-faint:#806D60;
    --radius-card:14px;
    --radius-pill:999px;
    --font-display:'Staatliches', system-ui, sans-serif;
    --font-body:'Manrope', system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ color-scheme: dark; }
  }
  :root[data-theme="dark"]{ color-scheme: dark; }

  *{ box-sizing:border-box; }
  html{ color-scheme: dark; scroll-behavior: smooth; }
  body{
    margin:0;
    min-height:100vh;
    font-family:var(--font-body);
    color:var(--text);
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 12% -10%, rgba(217,34,40,0.18), transparent 42%),
      radial-gradient(circle at 92% 0%, rgba(255,77,79,0.12), transparent 38%);
    -webkit-font-smoothing:antialiased;
    padding-bottom:120px;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  h1,h2,h3{ margin:0; font-family:var(--font-display); font-weight:400; letter-spacing:.02em; }
  p{ margin:0; }
  button{ font-family:inherit; }
  ::selection{ background:var(--ember); color:#ffffff; }
  :focus-visible{ outline:2px solid var(--ember); outline-offset:2px; }
  .muted{ color:var(--text-muted); font-size:14px; }
  .num{ font-variant-numeric: tabular-nums; }

  /* Custom smooth scrollbars */
  *::-webkit-scrollbar{ width:6px; height:6px; }
  *::-webkit-scrollbar-track{ background:transparent; }
  *::-webkit-scrollbar-thumb{ background:var(--border); border-radius:999px; }
  *::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }

  /* ---------------- Top nav ---------------- */
  .topnav{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:18px;
    padding:14px 20px;
    background:rgba(20,15,13,0.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border-soft);
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-right:auto; }
  .brand .flame{ flex:none; }
  .brand-logo{ flex:none; border-radius:50%; display:block; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text strong{ font-family:var(--font-display); font-size:22px; letter-spacing:.03em; }
  .brand-text strong em{ font-style:normal; color:var(--ember); }
  .brand-text span{ font-size:11px; color:var(--text-faint); }
  .tabs{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-pill); padding:4px; overflow-x:auto; max-width:min(60vw, 420px); -webkit-overflow-scrolling:touch; }
  .nav-tab{
    position:relative;
    padding:8px 16px; border-radius:var(--radius-pill);
    color:var(--text-muted); text-decoration:none; font-weight:600; font-size:14px;
    transition:background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .nav-tab.active{ background:var(--ember); color:#ffffff; font-weight:700; }
  .nav-badge{
    display:none; margin-left:6px; padding:1px 6px; border-radius:var(--radius-pill);
    background:var(--wine); color:#fff; font-size:11px; font-weight:700;
  }
  .nav-badge.show{ display:inline-block; }
  .conn-dot{ width:9px; height:9px; border-radius:50%; background:var(--text-faint); flex:none; }
  .conn-dot.live{ background:var(--sage); box-shadow:0 0 0 3px rgba(111,162,135,0.25); }

  main#view{ max-width:1200px; margin:0 auto; padding:20px; }

  /* ---------------- Chips / filters ---------------- */
  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:14px; margin-bottom:6px; -webkit-overflow-scrolling:touch; }
  .chip{
    flex:none; padding:8px 16px; border-radius:var(--radius-pill);
    border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    font-weight:600; font-size:14px; cursor:pointer;
  }
  .chip.active{ background:var(--ember); border-color:var(--ember); color:#ffffff; font-weight:700; }

  /* ---------------- Order page ---------------- */
  .cat-section{ margin-bottom:28px; }
  .cat-title{ font-size:26px; margin-bottom:12px; color:var(--amber); }
  .item-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; }
  .item-card{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:14px 16px;
    transition:border-color .15s ease;
  }
  .item-card.in-cart{ border-color:var(--ember); }
  .item-info h3{ font-family:var(--font-body); font-weight:700; font-size:15.5px; margin-bottom:3px; }
  .item-info .tagline{ font-size:12.5px; color:var(--text-muted); margin-bottom:8px; max-width:32ch; }
  .item-info .price{ font-weight:800; color:var(--amber); font-size:14.5px; }
  .stepper{ display:flex; align-items:center; gap:8px; flex:none; }
  .step-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:18px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer; line-height:1;
  }
  .step-btn.add{ background:var(--ember); border-color:var(--ember); color:#ffffff; width:auto; padding:0 14px; border-radius:var(--radius-pill); font-size:14px; }
  .stepper .qty{ min-width:18px; text-align:center; font-weight:700; }
  .stepper.small .step-btn{ width:28px; height:28px; font-size:15px; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-state h2{ font-size:26px; color:var(--text); margin-bottom:8px; }
  .empty-state .btn{ margin-top:16px; display:inline-flex; }
  .empty-col{ color:var(--text-faint); font-size:13px; padding:18px 4px; text-align:center; }

  /* ---------------- Cart bar ---------------- */
  .cart-bar{
    position:fixed; left:50%; bottom:18px; transform:translate(-50%, 140%);
    display:flex; align-items:center; gap:16px;
    background:var(--ember); color:#ffffff; border:none;
    padding:14px 22px; border-radius:var(--radius-pill);
    font-weight:700; font-size:14.5px; cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    transition:transform .22s ease;
    z-index:25;
  }
  .cart-bar.show{ transform:translate(-50%, 0); }
  .cart-bar-cta{ opacity:.9; }

  /* ---------------- Modals ---------------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,8,6,0.6);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
    z-index:40; padding:0;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:440px; max-height:85vh; overflow-y:auto;
    -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
    background:var(--surface); border:1px solid var(--border-soft);
    border-radius:20px 20px 0 0;
    padding:20px 20px 26px;
    box-shadow:0 -10px 40px rgba(0,0,0,.5);
    transform:translateY(12px);
    transition:transform .18s ease;
  }
  .modal-overlay.open .modal{ transform:translateY(0); }
  @media (min-width:640px){
    .modal-overlay{ align-items:center; }
    .modal{ border-radius:18px; }
  }
  .modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .modal-header h2{ font-size:24px; }
  .icon-btn{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .icon-btn.danger{ color:var(--wine); }

  .cart-items{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; max-height:48vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .cart-row{ display:flex; align-items:center; gap:10px; }
  .cart-row-name{ flex:1; font-size:14px; font-weight:600; }
  .cart-row-price{ font-weight:700; font-size:13.5px; color:var(--amber); min-width:56px; text-align:right; }
  .cart-total-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); margin-bottom:16px; font-size:15px; }
  .cart-total-row strong{ color:var(--amber); font-size:19px; }

  .field{ display:block; font-size:13px; color:var(--text-muted); font-weight:600; margin-bottom:14px; }
  .field input, .field textarea, .field select{
    display:block; width:100%; margin-top:6px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:11px 12px; font-family:var(--font-body); font-size:14.5px;
    resize:vertical;
  }
  .field input.invalid{ border-color:var(--wine); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 20px; border-radius:var(--radius-pill); border:1px solid transparent;
    font-weight:700; font-size:14.5px; cursor:pointer; text-decoration:none;
  }
  .btn.primary{ background:var(--ember); color:#ffffff; }
  .btn.primary:disabled{ opacity:.6; cursor:default; }
  .btn.ghost{ background:transparent; border-color:var(--border); color:var(--text); }
  .btn.ghost.danger{ color:var(--wine); border-color:rgba(163,64,63,0.4); }
  .btn.ghost.danger:hover{ background:rgba(163,64,63,0.15); border-color:var(--wine); }
  .btn.block{ width:100%; }
  .btn.small{ padding:6px 14px; font-size:13px; }

  /* ---------------- Payment Modal & QR ---------------- */
  .payment-modal{ max-width:480px; }
  .pay-summary-box{
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:12px; padding:12px 16px; margin-bottom:14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .pay-cust-info{ display:flex; flex-direction:column; }
  .pay-cust-name{ font-size:16px; font-weight:800; color:var(--text); }
  .pay-items-count{ font-size:12px; }
  .pay-amount-box{ text-align:right; display:flex; flex-direction:column; }
  .pay-lbl{ font-size:11px; text-transform:uppercase; color:var(--text-faint); font-weight:700; }
  .pay-amount{ font-size:24px; font-weight:800; color:var(--amber); }

  .upi-qr-card{
    background:#ffffff; border-radius:14px; padding:16px; margin-bottom:18px;
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .qr-frame{
    width:100%; max-width:250px; aspect-ratio:1/1;
    overflow:hidden; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:#ffffff;
  }
  .qr-img{ width:100%; height:100%; object-fit:contain; display:block; }
  .qr-instructions{ display:flex; flex-direction:column; gap:3px; color:#140F0D; }
  .qr-instructions strong{ font-size:15px; font-weight:800; }
  .qr-instructions span{ font-size:12px; color:#66554B; font-weight:600; }

  .pay-confirm-btn{
    font-size:16px; padding:15px 20px; background:var(--sage); color:#ffffff; font-weight:800;
    box-shadow:0 6px 18px rgba(78,159,118,0.35); letter-spacing:.01em;
  }
  .pay-confirm-btn:hover{ background:var(--sage-dark); transform:translateY(-1px); }

  /* Payment Pill */
  .pay-pill{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11px; font-weight:800; padding:2px 8px; border-radius:var(--radius-pill);
  }
  .pay-pill.paid{ background:rgba(78,159,118,0.2); color:var(--sage); }
  .pay-pill.pending{ background:rgba(255,77,79,0.2); color:var(--amber); }
  .mark-paid-btn{
    border:none; background:var(--sage); color:#fff;
    font-size:11px; font-weight:700; padding:2px 7px; border-radius:var(--radius-pill); cursor:pointer;
    margin-left:4px;
  }
  .mark-paid-btn:hover{ opacity:.9; }

  /* ---------------- Kitchen board ---------------- */
  .kitchen-page .kicker{ color:var(--text-muted); font-size:13.5px; margin-bottom:18px; }
  .kstats{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .kstat{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:10px 18px; display:flex; flex-direction:column; align-items:flex-start; min-width:96px;
  }
  .kstat strong{ font-family:var(--font-display); font-size:26px; line-height:1; color:var(--amber); }
  .kstat span{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .kstat.clickable{ cursor:pointer; }
  .kstat.clickable strong{ color:var(--wine); }

  .board{
    display:flex; gap:16px; overflow-x:auto; padding-bottom:14px;
    -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain;
  }
  .board-col{ flex:1 1 290px; min-width:260px; max-width:400px; display:flex; flex-direction:column; }
  .col-title{ font-size:20px; display:flex; align-items:center; gap:8px; margin-bottom:12px; color:var(--text); }
  .col-count{ background:var(--surface-2); color:var(--text-muted); font-family:var(--font-body); font-size:12px; font-weight:700; padding:2px 9px; border-radius:var(--radius-pill); }
  .col-list{
    display:flex; flex-direction:column; gap:10px;
    max-height:min(72vh, 650px); min-height:120px;
    overflow-y:auto; overscroll-behavior-y:contain;
    -webkit-overflow-scrolling:touch;
    padding-right:4px;
    scrollbar-width:thin; scrollbar-color:var(--border) transparent;
  }

  .order-card{
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--text-faint);
    border-radius:var(--radius-card); padding:14px 16px;
  }
  .order-card.urgency-ok{ border-left-color:var(--sage); }
  .order-card.urgency-warn{ border-left-color:var(--amber); }
  .order-card.urgency-late{ border-left-color:var(--wine); }
  .order-card.urgency-done{ border-left-color:var(--sage-dark); opacity:.85; }
  .order-card-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .order-num{ font-family:var(--font-display); font-size:20px; color:var(--ember); letter-spacing:.02em; }
  .order-time{ font-size:12px; color:var(--text-faint); }
  .order-cust{ font-weight:700; font-size:14px; margin-bottom:8px; }
  .order-items{ list-style:none; margin:0 0 8px; padding:0; font-size:13.5px; color:var(--text-muted); display:flex; flex-direction:column; gap:2px; }
  .order-notes{ font-size:12.5px; color:var(--amber); font-style:italic; margin-bottom:10px; }
  .order-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }

  /* ---------------- Menu setup ---------------- */
  .menu-page-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:10px; }
  .menu-page-head h1{ font-size:30px; }
  .menu-page .kicker{ color:var(--text-muted); font-size:13.5px; margin-bottom:22px; }
  .menu-list{ display:flex; flex-direction:column; gap:8px; }
  .menu-row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px;
  }
  .menu-row-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .menu-row-name{ font-weight:700; font-size:14.5px; }
  .menu-row-cat{ font-size:11.5px; color:var(--text-faint); }
  .menu-row-price{ font-weight:700; color:var(--amber); font-size:14px; min-width:56px; text-align:right; }

  .switch{ position:relative; display:inline-block; width:38px; height:22px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch-track{ position:absolute; inset:0; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-pill); transition:background .15s ease; }
  .switch-track::before{ content:''; position:absolute; width:16px; height:16px; left:2px; top:2px; background:var(--text-faint); border-radius:50%; transition:transform .15s ease, background .15s ease; }
  .switch input:checked + .switch-track{ background:rgba(111,162,135,0.25); border-color:var(--sage); }
  .switch input:checked + .switch-track::before{ transform:translateX(16px); background:var(--sage); }

  /* ---------------- History ---------------- */
  .hist-controls{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .hist-controls .chips{ padding-bottom:0; margin-bottom:0; flex:1 1 auto; }
  .hist-search{
    flex:1 1 220px; min-width:180px; max-width:320px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:9px 14px; font-family:var(--font-body); font-size:14px;
  }
  .history-list{
    border:1px solid var(--border); border-radius:var(--radius-card);
    background:var(--surface); overflow:hidden;
  }
  .history-row-labels, .history-row-head{
    display:grid; grid-template-columns:74px 90px 1fr 90px 84px 120px;
    gap:12px; align-items:center; width:100%;
  }
  .history-row-labels{ padding:10px 16px; font-size:11px; color:var(--text-faint); font-weight:700; background:var(--surface-2); border-bottom:1px solid var(--border-soft); }
  .history-row{ border-bottom:1px solid var(--border-soft); }
  .history-row:last-child{ border-bottom:none; }
  .history-row-head{ padding:12px 16px; cursor:pointer; transition:background .15s ease; }
  .history-row-head:hover{ background:var(--surface-2); }
  .order-num.small{ font-size:15px; }
  .hist-time{ font-size:12.5px; color:var(--text-muted); }
  .hist-cust{ font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hist-items-count{ font-size:12.5px; }
  .hist-total{ font-weight:700; color:var(--amber); font-size:13.5px; }
  .history-row-body{ padding:0 16px 14px 16px; }
  .history-row-body .order-items{ color:var(--text-muted); }
  .history-row-body .order-notes{ margin-top:6px; }
  .history-row-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px; padding-top:8px; border-top:1px dashed var(--border-soft); }
  .status-pill{ justify-self:start; font-size:11px; font-weight:700; padding:3px 10px; border-radius:var(--radius-pill); }
  .pill-placed{ background:rgba(171,151,129,0.18); color:var(--text-muted); }
  .pill-cooking, .pill-in-process{ background:rgba(255,77,79,0.16); color:var(--amber); }
  .pill-cooking-finished{ background:rgba(217,34,40,0.22); color:var(--ember); }
  .pill-delivered{ background:rgba(78,159,118,0.18); color:var(--sage); }
  .pill-cancelled{ background:rgba(153,27,27,0.22); color:var(--wine); }

  /* ---------------- Toasts ---------------- */
  .toast-container{ position:fixed; top:76px; left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:10px 18px; border-radius:var(--radius-pill); font-size:13.5px; font-weight:600;
    opacity:0; transform:translateY(-8px); transition:opacity .2s ease, transform .2s ease;
    box-shadow:0 8px 24px rgba(0,0,0,.4); max-width:88vw;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast.error{ border-color:var(--wine); color:#FADCDC; }

  /* ---------------- Live Batch Production Bar (Option A) ---------------- */
  .batch-command-bar{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-card); padding:14px 18px; margin-bottom:18px;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px;
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
  }
  .batch-col{ display:flex; flex-direction:column; gap:10px; }
  .batch-col-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .batch-title{ font-family:var(--font-display); font-size:17px; letter-spacing:.02em; display:flex; align-items:center; gap:6px; }
  .batch-col.placed .batch-title{ color:var(--amber); }
  .batch-col.cooking .batch-title{ color:var(--ember); }
  .batch-total-tag{ font-size:12px; font-weight:700; background:var(--surface-2); padding:3px 10px; border-radius:var(--radius-pill); color:var(--text); }
  .batch-chips-wrap{ display:flex; flex-wrap:wrap; gap:8px; }
  .batch-item-chip{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius-pill); padding:5px 12px 5px 14px;
    font-size:13px; font-weight:600; color:var(--text);
  }
  .batch-item-chip .num-badge{ font-weight:800; font-size:14px; color:var(--amber); }
  .batch-item-chip .batch-btn{
    border:none; background:var(--ember); color:#fff;
    border-radius:var(--radius-pill); font-size:11.5px; font-weight:700;
    padding:3px 8px; cursor:pointer; display:inline-flex; align-items:center; gap:3px;
    transition:opacity .15s ease, transform .1s ease;
  }
  .batch-item-chip .batch-btn:hover{ opacity:.9; transform:scale(1.03); }
  .batch-item-chip .batch-btn.ready-btn{ background:var(--sage); color:#fff; }
  .batch-empty{ font-size:12.5px; color:var(--text-faint); font-style:italic; padding:4px 0; }

  /* ---------------- Pit Master Screen (Option B & C) ---------------- */
  .pitmaster-page .pit-header{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:12px; margin-bottom:16px;
  }
  .pitmaster-page .pit-title{ font-size:28px; color:var(--text); display:flex; align-items:center; gap:8px; }
  .pit-quick-stats{ display:flex; gap:8px; flex-wrap:wrap; }
  .pit-stat-pill{
    background:var(--surface); border:1px solid var(--border);
    padding:6px 14px; border-radius:var(--radius-pill); font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  .pit-stat-pill strong{ font-size:15px; }

  .pit-layout{
    display:grid; grid-template-columns:1fr; gap:18px;
  }
  @media (min-width: 900px){
    .pit-layout{ grid-template-columns: 420px 1fr; }
  }

  /* Left Panel: Matrix */
  .pit-matrix-panel{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-card); padding:16px; display:flex; flex-direction:column; gap:12px;
    max-height:calc(100vh - 160px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .pit-matrix-title{ font-size:20px; display:flex; justify-content:space-between; align-items:center; }
  .matrix-cat-title{ font-size:14px; color:var(--amber); text-transform:uppercase; letter-spacing:.05em; font-weight:700; margin:10px 0 4px; }
  .matrix-card{
    background:var(--surface-2); border:1px solid var(--border-soft);
    border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:8px;
    transition:border-color .15s ease;
  }
  .matrix-card.has-demand{ border-color:var(--ember); background:rgba(217,34,40,0.06); }
  .matrix-card-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .matrix-card-name{ font-weight:700; font-size:14.5px; }
  .matrix-card-price{ font-size:12.5px; color:var(--text-faint); font-weight:600; }
  .matrix-stages-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; background:var(--bg);
    padding:6px 8px; border-radius:8px; text-align:center;
  }
  .matrix-stage-box{ display:flex; flex-direction:column; align-items:center; }
  .matrix-stage-lbl{ font-size:10.5px; text-transform:uppercase; color:var(--text-faint); font-weight:700; }
  .matrix-stage-val{ font-size:18px; font-weight:800; line-height:1.2; font-family:var(--font-display); }
  .matrix-stage-val.val-placed{ color:var(--amber); }
  .matrix-stage-val.val-cooking{ color:var(--ember); }
  .matrix-stage-val.val-ready{ color:var(--sage); }
  .matrix-card-actions{ display:flex; gap:6px; }
  .matrix-btn{
    flex:1; border:none; padding:7px 10px; border-radius:var(--radius-pill);
    font-size:12px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:4px;
    transition:opacity .15s ease;
  }
  .matrix-btn.to-grill{ background:var(--ember); color:#ffffff; }
  .matrix-btn.to-ready{ background:var(--sage); color:#ffffff; }
  .matrix-btn:disabled{ opacity:.35; cursor:not-allowed; }

  /* Right Panel: Active Order Stream */
  .pit-stream-panel{
    display:flex; flex-direction:column; gap:12px;
  }
  .pit-stream-controls{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .pit-search{
    flex:1 1 200px; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); border-radius:10px; padding:8px 12px; font-size:13.5px;
  }
  .pit-ticket-list{
    display:flex; flex-direction:column; gap:12px;
    max-height:calc(100vh - 220px); overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-right:4px;
  }
  .pit-ticket{
    background:var(--surface); border:1px solid var(--border); border-left:6px solid var(--text-faint);
    border-radius:var(--radius-card); padding:16px 18px; display:flex; flex-direction:column; gap:10px;
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
  }
  .pit-ticket.urgency-ok{ border-left-color:var(--sage); }
  .pit-ticket.urgency-warn{ border-left-color:var(--amber); }
  .pit-ticket.urgency-late{ border-left-color:var(--wine); }
  .pit-ticket.urgency-done{ border-left-color:var(--sage-dark); opacity:.85; }
  .pit-ticket-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .pit-ticket-num{ font-family:var(--font-display); font-size:26px; color:var(--ember); letter-spacing:.02em; }
  .pit-ticket-meta{ display:flex; align-items:center; gap:10px; }
  .pit-ticket-time{ font-size:13px; color:var(--text-faint); }
  .pit-ticket-cust{ font-size:17px; font-weight:800; color:var(--text); }
  .pit-ticket-items{
    list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px;
    font-size:15px; font-weight:600; color:var(--text);
  }
  .pit-ticket-items li strong{ color:var(--amber); margin-right:4px; }
  .pit-ticket-notes{ font-size:13px; color:var(--amber); font-style:italic; background:rgba(255,77,79,0.1); padding:6px 10px; border-radius:6px; }
  .pit-ticket-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .pit-action-btn{
    flex:1 1 160px; padding:12px 18px; border-radius:var(--radius-pill); border:none;
    font-size:14.5px; font-weight:800; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .pit-action-btn.grill{ background:var(--ember); color:#ffffff; }
  .pit-action-btn.ready{ background:var(--amber); color:#140F0D; }
  .pit-action-btn.deliver{ background:var(--sage); color:#ffffff; }
  .pit-action-btn.back{ flex:0 0 auto; background:transparent; border:1px solid var(--border); color:var(--text-muted); font-size:13px; font-weight:600; padding:8px 14px; }

  @media (max-width:720px){
    .history-row-labels{ display:none; }
    .history-row-head{
      display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center;
      gap:6px 12px; padding:12px 14px;
    }
    .history-row-head .order-num{ font-size:17px; }
    .history-row-head .hist-time{ font-size:12px; order:1; }
    .history-row-head .status-pill{ order:2; margin-left:auto; }
    .history-row-head .hist-cust{ width:100%; order:3; font-size:14px; margin-top:2px; }
    .history-row-head .hist-items-count{ order:4; font-size:12px; color:var(--text-muted); }
    .history-row-head .hist-total{ order:5; margin-left:auto; font-size:14px; }
    .col-list{ max-height:min(60vh, 480px); }
  }

  @media (max-width:640px){
    .topnav{ padding:12px 14px; gap:10px; }
    .brand-text strong{ font-size:18px; }
    .brand-text span{ display:none; }

    main#view{ padding:14px; }
    .cat-title{ font-size:22px; }

<body>

  <header class="topnav">
    <div class="brand">
      <img class="brand-logo" src="/icon-192.png" width="34" height="34" alt="Smoke Signal BBQ logo" />
      <div class="brand-text">
        <strong>Smoke Signal <em>BBQ</em></strong>
        <span>Order counter for BITS Pilani Goa</span>
      </div>
    </div>
    <nav class="tabs">
      <a href="#order" class="nav-tab" id="tabOrder">Order</a>
      <a href="#kitchen" class="nav-tab" id="tabKitchen">Kitchen<span id="kitchenBadge" class="nav-badge"></span></a>
      <a href="#pitmaster" class="nav-tab" id="tabPitmaster">🔥 Pit Master<span id="pitmasterBadge" class="nav-badge"></span></a>
      <a href="#menu" class="nav-tab" id="tabMenu">Menu</a>
      <a href="#history" class="nav-tab" id="tabHistory">History</a>
    </nav>
    <span id="connDot" class="conn-dot" title="Connecting…"></span>
  </header>

  <main id="view"></main>

  <button id="cartBar" class="cart-bar" type="button">
    <span><strong id="cartBarCount" class="num">0</strong> items</span>
    <span id="cartBarTotal" class="num">₹0</span>
    <span class="cart-bar-cta">View cart</span>
  </button>

  <!-- Cart / checkout modal -->
  <div id="cartModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header"><h2>Your order</h2><button class="icon-btn" id="closeCartBtn" aria-label="Close">✕</button></div>
      <div id="cartItemsList" class="cart-items"></div>
      <div class="cart-total-row"><span>Total</span><strong id="cartTotalAmt" class="num">₹0</strong></div>
      <label class="field">Customer / table name
        <input id="custNameInput" type="text" placeholder="e.g. Table 4 or Aditi" maxlength="40" />
      </label>
      <label class="field">Notes (optional)
        <textarea id="orderNotesInput" rows="2" maxlength="140" placeholder="e.g. no onions"></textarea>
      </label>
      <button class="btn primary block" id="goToPaymentBtn">Proceed to Payment →</button>
    </div>
  </div>

  <!-- Payment / QR modal -->
  <div id="paymentModal" class="modal-overlay">
    <div class="modal payment-modal">
      <div class="modal-header">
        <button class="icon-btn" id="backToCartBtn" aria-label="Back to Cart" title="Back to Cart">←</button>
        <h2>BITS Pilani Payment Gateway</h2>
        <button class="icon-btn" id="closePaymentModalBtn" aria-label="Close">✕</button>
      </div>
      <div class="pay-summary-box">
        <div class="pay-cust-info">
          <span class="pay-cust-name" id="payCustName">Customer Name</span>
          <span class="pay-items-count muted" id="payItemsSummary">0 items</span>
        </div>
        <div class="pay-amount-box">
          <span class="pay-lbl">Total to Pay</span>
          <strong class="pay-amount num" id="payTotalAmt">₹0</strong>
        </div>
      </div>

      <div id="upiQrWrap" class="upi-qr-card">
        <div class="qr-frame">
          <img src="/payment-qr.jpg" alt="BITS Pilani Payment Gateway QR Code" class="qr-img" />
        </div>
        <div class="qr-instructions">
          <strong>BITS Pilani Payment Gateway</strong>
          <span>Scan with BITS Pilani Payment Gateway to pay</span>
        </div>
      </div>

      <button class="btn primary block pay-confirm-btn" id="confirmPaidBtn" type="button">
        ✅ Confirm Payment Received &amp; Place Order
      </button>
    </div>
  </div>

  <!-- Menu item add/edit modal -->
  <div id="itemModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header"><h2 id="itemModalTitle">Add item</h2><button class="icon-btn" id="closeItemModalBtn" aria-label="Close">✕</button></div>
      <label class="field">Name
        <input id="itemNameInput" type="text" maxlength="60" placeholder="e.g. Peri Peri Burger" />
      </label>
      <label class="field">Tagline (optional)
        <input id="itemTaglineInput" type="text" maxlength="80" placeholder="Short flavour description" />
      </label>
      <label class="field">Category
        <select id="itemCategoryInput"></select>
      </label>
      <label class="field">Price (₹)
        <input id="itemPriceInput" type="number" min="1" step="1" placeholder="150" />
      </label>
      <button class="btn primary block" id="saveItemBtn">Save item</button>
    </div>
  </div>

  <!-- Cancelled orders modal -->
  <div id="cancelledModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header"><h2>Cancelled orders</h2><button class="icon-btn" id="closeCancelledBtn" aria-label="Close">✕</button></div>
      <div id="cancelledList" class="cart-items"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

<script>
(function(){
  'use strict';

  var CATEGORIES = ['Burgers','Wings','Sides'];
  var CART_KEY = 'ssbbq_cart_draft_v1';

  // ---------------- State ----------------
  var connected = false;
  var currentRoute = 'order';
  var currentFilter = 'All';
  var menuItems = [];
  var cart = {};
  var boardOrders = [];
  var deliveredOrders = [];
  var cancelledOrders = [];
  var allOrders = [];
  var historyFilter = 'All';
  var historySearch = '';
  var expandedOrders = {};
  var editingItemId = null;
  var pitSearch = '';
  var pitFilter = 'all';

  // ---------------- Small utilities ----------------
  function qs(sel, ctx){ return (ctx || document).querySelector(sel); }
  function qsa(sel, ctx){ return Array.prototype.slice.call((ctx || document).querySelectorAll(sel)); }
  function fmtMoney(n){ return '₹' + Math.round(Number(n) || 0); }
  function tokenLabel(n){ return '#' + String(n == null ? 0 : n).padStart(3, '0'); }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function timeAgo(ts){
    if (!ts) return '';
    var m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return 'Just now';
    return m + 'm ago';
  }
  function urgencyClass(ts){
    var m = (Date.now() - ts) / 60000;
    if (m < 5) return 'urgency-ok';
    if (m < 10) return 'urgency-warn';
    return 'urgency-late';
  }

  function showToast(msg, isError){
    var container = qs('#toastContainer');
    if (!container) return;
    var t = document.createElement('div');
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg;
    container.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add('show'); });
    setTimeout(function(){
      t.classList.remove('show');
      setTimeout(function(){ t.remove(); }, 300);
    }, 3200);
  }

  function emptyState(title, sub, extraHtml){
    return '<div class="empty-state"><h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(sub) + '</p>' + (extraHtml || '') + '</div>';
  }
  function emptyColHtml(msg){ return '<p class="empty-col">' + escapeHtml(msg) + '</p>'; }

  // ---------------- Demand & Batch Calculations ----------------
  function computeGrillDemand(){
    var demand = {};
    menuItems.forEach(function(m){
      demand[m.name] = { id: m.id, name: m.name, category: m.category, price: m.price, placed: 0, cooking: 0, ready: 0, total: 0 };
    });

    allOrders.forEach(function(o){
      if (o.status === 'cancelled' || o.status === 'delivered') return;
      (o.items || []).forEach(function(it){
        var key = it.name;
        if (!demand[key]) {
          demand[key] = { id: it.id, name: it.name, category: 'Other', price: it.price || 0, placed: 0, cooking: 0, ready: 0, total: 0 };
        }
        var q = it.qty || 1;
        if (o.status === 'placed') demand[key].placed += q;
        else if (o.status === 'in_process') demand[key].cooking += q;
        else if (o.status === 'cooking_finished') demand[key].ready += q;
        demand[key].total += q;
      });
    });

    var list = Object.values(demand);
    return {
      items: list,
      totalPlaced: list.reduce(function(s, x){ return s + x.placed; }, 0),
      totalCooking: list.reduce(function(s, x){ return s + x.cooking; }, 0),
      totalReady: list.reduce(function(s, x){ return s + x.ready; }, 0)
    };
  }

  function refreshLocalOrderLists(){
    boardOrders = allOrders.filter(function(o){ return o.status === 'placed' || o.status === 'in_process' || o.status === 'cooking_finished'; });
    deliveredOrders = allOrders.filter(function(o){ return o.status === 'delivered'; })
      .sort(function(a, b){ return (b.updatedAt || 0) - (a.updatedAt || 0); }).slice(0, 100);
    cancelledOrders = allOrders.filter(function(o){ return o.status === 'cancelled'; })
      .sort(function(a, b){ return (b.updatedAt || 0) - (a.updatedAt || 0); }).slice(0, 100);
  }

  async function batchAdvanceItem(itemName, fromStatus, toStatus){
    if (!itemName) return;
    var targetLabel = toStatus === 'in_process' ? 'the Grill' : (toStatus === 'cooking_finished' ? 'Ready to Serve' : toStatus);
    showToast('Moving ' + itemName + ' to ' + targetLabel + '…');
    var now = Date.now();
    allOrders.forEach(function(o){
      if (o.status === fromStatus && (o.items || []).some(function(it){ return it.name === itemName || it.id === itemName; })) {
        o.status = toStatus;
        o.updatedAt = now;
      }
    });
    refreshLocalOrderLists();
    updateNavBadge();
    if (currentRoute === 'kitchen') renderKitchenView();
    if (currentRoute === 'pitmaster') renderPitmasterView();

    try {
      await apiSend('/api/orders', 'PATCH', { itemName: itemName, fromStatus: fromStatus, toStatus: toStatus });
      await refreshOrders();
      showToast('All ' + itemName + ' moved to ' + targetLabel + '!');
    } catch(e) {
      console.error(e);
      showToast('Batch update error: ' + (e.message || 'Error'), true);
    }
  }

  async function batchAdvanceAll(fromStatus, toStatus){
    var label = fromStatus === 'placed' ? 'ALL Placed orders to the Grill' : 'ALL Cooking orders to Ready to Serve';
    if (!confirm('Move ' + label + '?')) return;
    showToast('Moving orders…');
    var now = Date.now();
    allOrders.forEach(function(o){
      if (o.status === fromStatus) {
        o.status = toStatus;
        o.updatedAt = now;
      }
    });
    refreshLocalOrderLists();
    updateNavBadge();
    if (currentRoute === 'kitchen') renderKitchenView();
    if (currentRoute === 'pitmaster') renderPitmasterView();

    try {
      await apiSend('/api/orders', 'PATCH', { fromStatus: fromStatus, toStatus: toStatus });
      await refreshOrders();
      showToast('Orders moved successfully!');
    } catch(e) {
      console.error(e);
      showToast('Batch move error: ' + (e.message || 'Error'), true);
    }
  }

  // ---------------- Cart draft persistence (per device, local only) ----------------
  function loadCartDraft(){
    try {
      var raw = localStorage.getItem(CART_KEY);
      cart = raw ? (JSON.parse(raw) || {}) : {};
    } catch (e) { cart = {}; }
  }
  function saveCartDraft(){
    try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) { /* ignore */ }
  }
  function cartCount(){
    return Object.keys(cart).reduce(function(sum, k){ return sum + cart[k].qty; }, 0);
  }
  function cartTotal(){
    return Object.keys(cart).reduce(function(sum, k){ return sum + cart[k].qty * cart[k].price; }, 0);
  }
  function setQty(item, qty){
    qty = Math.max(0, Math.min(50, qty));
    if (qty <= 0) { delete cart[item.id]; }
    else { cart[item.id] = { id: item.id, name: item.name, price: item.price, qty: qty }; }
    saveCartDraft();
    if (currentRoute === 'order') renderOrderView();
    renderCartItems();
    updateCartBar();
  }

  // ---------------- REST API client ----------------
  async function apiGet(path){
    var res = await fetch(path);
    if (!res.ok) throw new Error('Request failed (' + res.status + ')');
    return res.json();
  }
  async function apiSend(path, method, body){
    var res = await fetch(path, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: body != null ? JSON.stringify(body) : undefined
    });
    if (!res.ok) {
      var msg = 'Request failed (' + res.status + ')';
      try { var j = await res.json(); if (j && j.error) msg = j.error; } catch (e) { /* ignore */ }
      throw new Error(msg);
    }
    try { return await res.json(); } catch (e) { return {}; }
  }

  function updateConnDot(){
    var dot = qs('#connDot');
    if (!dot) return;
    dot.classList.toggle('live', connected);
    dot.title = connected ? 'Connected' : 'Reconnecting…';
  }

  var lastOrdersHash = '';
  var lastMenuHash = '';

  async function refreshMenu(){
    try {
      var items = await apiGet('/api/menu');
      connected = true; updateConnDot();
      var hash = JSON.stringify(items);
      if (hash !== lastMenuHash) {
        lastMenuHash = hash;
        menuItems = items;
        if (currentRoute === 'order') renderOrderView();
        if (currentRoute === 'menu') renderMenuView();
        if (currentRoute === 'pitmaster') renderPitmasterView();
      }
    } catch (e) {
      console.error('menu refresh failed', e);
      connected = false; updateConnDot();
    }
  }

  async function refreshOrders(){
    try {
      var orders = await apiGet('/api/orders');
      connected = true; updateConnDot();
      var hash = JSON.stringify(orders);
      if (hash !== lastOrdersHash) {
        lastOrdersHash = hash;
        allOrders = orders;
        refreshLocalOrderLists();
        updateNavBadge();
        if (currentRoute === 'kitchen') renderKitchenView();
        if (currentRoute === 'pitmaster') renderPitmasterView();
        if (currentRoute === 'history') renderHistoryBody();
        renderCancelledModal();
      }
    } catch (e) {
      console.error('orders refresh failed', e);
      connected = false; updateConnDot();
    }
  }

  function startPolling(){
    setInterval(function(){ if (!document.hidden) refreshMenu(); }, 5000);
    setInterval(function(){ if (!document.hidden) refreshOrders(); }, 3000);
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) { refreshMenu(); refreshOrders(); }
    });
  }

  // ---------------- Boot ----------------
  async function boot(){
    loadCartDraft();
    qs('#itemCategoryInput').innerHTML = CATEGORIES.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');
    wireStaticEvents();
    route();
    window.addEventListener('hashchange', route);

    await Promise.all([refreshMenu(), refreshOrders()]);
    startPolling();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('/sw.js').catch(function(){ /* offline shell is a bonus, not required */ });
      });
    }

  function updateNavBadge(){
    var kb = qs('#kitchenBadge');
    if (kb) {
      var n = boardOrders.length;
      kb.textContent = n > 0 ? n : '';
      kb.classList.toggle('show', n > 0);
    }
    var pb = qs('#pitmasterBadge');
    if (pb) {
      var demand = computeGrillDemand();
      var p = demand.totalPlaced;
      pb.textContent = p > 0 ? (p + ' to grill') : '';
      pb.classList.toggle('show', p > 0);
    }
  }

  function paymentPillHtml(order){
    var isPending = order.paymentStatus === 'pending';
    if (isPending) {
      return '<span class="pay-pill pending">⏳ Pay Pending<button class="mark-paid-btn" data-order="' + order.id + '" type="button">✓ Mark Paid</button></span>';
    }
    return '<span class="pay-pill paid">✓ Paid</span>';
  }

  async function placeOrderNow(customerName, notes, paymentStatus, paymentMethod){
    var items = Object.keys(cart).map(function(k){ return cart[k]; });
    if (items.length === 0) return null;
    var total = cartTotal();
    var order = await apiSend('/api/orders', 'POST', {
      items: items,
      total: total,
      customerName: customerName || '',
      notes: notes || '',
      paymentStatus: paymentStatus || 'paid',
      paymentMethod: paymentMethod || 'upi'
    });
    cart = {};
    saveCartDraft();
    await refreshOrders();
    return order.orderNumber;
  }

  async function markOrderPaid(orderId){
    if (!orderId) return;
    var now = Date.now();
    allOrders.forEach(function(o){
      if (o.id === orderId) {
        o.paymentStatus = 'paid';
        o.updatedAt = now;
      }
    });
    refreshLocalOrderLists();
    if (currentRoute === 'kitchen') renderKitchenView();
    if (currentRoute === 'pitmaster') renderPitmasterView();
    if (currentRoute === 'history') renderHistoryBody();

    try {
      showToast('Payment confirmed for order!');
      await apiSend('/api/orders/' + orderId, 'PATCH', { paymentStatus: 'paid' });
      await refreshOrders();
    } catch(e) {
      console.error(e);
      showToast('Could not update payment: ' + (e.message || 'Error'), true);
    }
  }

  async function advanceStatus(orderId, next){
    var now = Date.now();
    allOrders.forEach(function(o){
      if (o.id === orderId) {
        o.status = next;
        o.updatedAt = now;
      }
    });
    refreshLocalOrderLists();
    updateNavBadge();
    if (currentRoute === 'kitchen') renderKitchenView();
    if (currentRoute === 'pitmaster') renderPitmasterView();
    if (currentRoute === 'history') renderHistoryBody();

    await apiSend('/api/orders/' + orderId, 'PATCH', { status: next });
    await refreshOrders();
  }
  async function cancelOrderById(orderId, orderNum){
    if (!confirm('Cancel order ' + tokenLabel(orderNum) + '?')) return;
    await apiSend('/api/orders/' + orderId, 'PATCH', { status: 'cancelled' });
    await refreshOrders();
  }
  async function deleteOrderById(orderId, orderNum){
    if (!confirm('Permanently delete order ' + tokenLabel(orderNum) + '? This cannot be undone.')) return;
    try {
      showToast('Deleting order ' + tokenLabel(orderNum) + '…');
      delete expandedOrders[orderId];
      await apiSend('/api/orders/' + orderId, 'DELETE');
      await refreshOrders();
      showToast('Order ' + tokenLabel(orderNum) + ' deleted.');
    } catch (e) {
      console.error(e);
      allOrders = allOrders.filter(function(o){ return o.id !== orderId; });
      delete expandedOrders[orderId];
      if (currentRoute === 'history') renderHistoryBody();
      else if (currentRoute === 'kitchen') renderKitchenView();
      else if (currentRoute === 'pitmaster') renderPitmasterView();
      updateNavBadge();
      showToast('Order ' + tokenLabel(orderNum) + ' deleted.');
    }
  }

  async function addMenuItem(data){ await apiSend('/api/menu', 'POST', data); await refreshMenu(); }
  async function updateMenuItem(id, patch){ await apiSend('/api/menu/' + id, 'PATCH', patch); await refreshMenu(); }
  async function deleteMenuItemById(id){
    if (!confirm('Remove this item from the menu?')) return;
    await apiSend('/api/menu/' + id, 'DELETE');
    await refreshMenu();
  }
  async function onSeedDefaultClick(){
    showToast('Loading starter menu…');
    try {
      await apiSend('/api/menu?seed=true', 'POST', {});
      await refreshMenu();
      showToast('Starter menu loaded with 12 items!');

  // ---------------- Routing ----------------
  function route(){
    var h = (location.hash || '#order').replace('#', '');
    currentRoute = ['order', 'kitchen', 'pitmaster', 'menu', 'history'].indexOf(h) >= 0 ? h : 'order';
    qsa('.nav-tab').forEach(function(a){
      a.classList.toggle('active', a.getAttribute('href') === '#' + currentRoute);
    });
    if (currentRoute === 'order') renderOrderView();
    else if (currentRoute === 'kitchen') renderKitchenView();
    else if (currentRoute === 'pitmaster') renderPitmasterView();
    else if (currentRoute === 'menu') renderMenuView();
    else renderHistoryPage();
    updateCartBar();
  }

  // ---------------- Order view ----------------
  function itemCardHtml(item){
    var qty = (cart[item.id] && cart[item.id].qty) || 0;
    return '' +
      '<div class="item-card' + (qty > 0 ? ' in-cart' : '') + '">' +
        '<div class="item-info">' +
          '<h3>' + escapeHtml(item.name) + '</h3>' +
          (item.tagline ? '<p class="tagline">' + escapeHtml(item.tagline) + '</p>' : '<p class="tagline">&nbsp;</p>') +

    var cats = ['All'].concat(CATEGORIES);

  function renderOrderView(){
    var spWin = window.scrollY || document.documentElement.scrollTop || 0;
    var view = qs('#view');
    var available = menuItems.filter(function(m){ return m.available !== false; });
    var bodyHtml;
    if (menuItems.length === 0) {
      bodyHtml = emptyState(
        'No items on the menu yet',
        'Load the starter Smoke Signal BBQ menu (12 items) or add items manually in Menu setup.',
        '<div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;">' +
          '<button class="btn primary seed-default-btn" type="button">Load Starter Menu (12 items)</button>' +
          '<a href="#menu" class="btn ghost">Go to Menu setup</a>' +
        '</div>'
      );
      view.innerHTML = bodyHtml;
      window.scrollTo(0, spWin);
      return;
    }
    if (available.length === 0) {
      bodyHtml = emptyState('Everything is sold out', 'Turn items back on from the Menu tab when ready.');
    } else if (currentFilter === 'All') {
      bodyHtml = CATEGORIES.map(function(cat){
        var items = available.filter(function(m){ return m.category === cat; })
          .sort(function(a, b){ return (a.sortOrder || 0) - (b.sortOrder || 0); });
        if (items.length === 0) return '';
        return '<section class="cat-section"><h2 class="cat-title">' + escapeHtml(cat) + '</h2><div class="item-grid">' +
          items.map(itemCardHtml).join('') + '</div></section>';
      }).join('');
    } else {
      var items = available.filter(function(m){ return m.category === currentFilter; })
        .sort(function(a, b){ return (a.sortOrder || 0) - (b.sortOrder || 0); });
      bodyHtml = '<div class="item-grid">' + items.map(itemCardHtml).join('') + '</div>';
    }
    view.innerHTML = '<div class="order-page">' + chipsHtml() + bodyHtml + '</div>';
    window.scrollTo(0, spWin);

    var bar = qs('#cartBar');
    var count = cartCount();
    var show = currentRoute === 'order' && count > 0;

    var list = qs('#cartItemsList');

    var items = Object.keys(cart).map(function(k){ return cart[k]; });

  function closeCartModal(){ qs('#cartModal').classList.remove('open'); }

  function onGoToPaymentClick(){
    var nameInput = qs('#custNameInput');
    var name = nameInput.value.trim();
    if (Object.keys(cart).length === 0) return;
    if (!name) { nameInput.classList.add('invalid'); nameInput.focus(); return; }
    nameInput.classList.remove('invalid');

    var count = cartCount();
    var total = cartTotal();
    qs('#payCustName').textContent = name;
    qs('#payItemsSummary').textContent = count + ' item' + (count === 1 ? '' : 's') + ' in cart';
    qs('#payTotalAmt').textContent = fmtMoney(total);

    closeCartModal();
    qs('#paymentModal').classList.add('open');
  }

  function closePaymentModal(){
    var modal = qs('#paymentModal');
    if (modal) modal.classList.remove('open');
  }

  function onBackToCartClick(){
    closePaymentModal();
    openCartModal();
  }

  async function processOrderCheckout(){
    var name = qs('#custNameInput').value.trim();
    var notes = qs('#orderNotesInput').value.trim();
    if (!name || Object.keys(cart).length === 0) return;

    var btn = qs('#confirmPaidBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Placing Order…'; }

    try {
      var num = await placeOrderNow(name, notes, 'paid', 'upi');
      closePaymentModal();
      qs('#custNameInput').value = '';
      qs('#orderNotesInput').value = '';
      showToast('Order ' + tokenLabel(num) + ' placed — Payment Confirmed!');
      renderOrderView();
      updateCartBar();
    } catch(e) {
      console.error(e);
      showToast('Could not place order: ' + (e.message || 'Error'), true);
    } finally {
      if (btn) { btn.disabled = false; btn.innerHTML = '✅ Confirm Payment Received &amp; Place Order'; }
    }
  }

  // ---------------- Pit Master view (Option B & C) ----------------
  function renderPitmasterView(){
    var spWin = window.scrollY || document.documentElement.scrollTop || 0;
    var view = qs('#view');
    var demand = computeGrillDemand();
    var activeOrders = boardOrders.slice().sort(function(a, b){ return a.createdAt - b.createdAt; });

    var q = pitSearch.trim().toLowerCase();
    var filteredTickets = activeOrders.filter(function(o){
      if (pitFilter !== 'all' && o.status !== pitFilter) return false;
      if (q) {
        var matchNum = String(o.orderNumber).indexOf(q) >= 0;
        var matchName = (o.customerName || '').toLowerCase().indexOf(q) >= 0;
        var matchItem = (o.items || []).some(function(it){ return it.name.toLowerCase().indexOf(q) >= 0; });
        if (!matchNum && !matchName && !matchItem) return false;
      }
      return true;
    });

    var matrixGroupsHtml = CATEGORIES.map(function(cat){
      var items = demand.items.filter(function(x){ return x.category === cat; });
      if (items.length === 0) return '';
      var cardsHtml = items.map(function(it){
        var hasDemand = it.placed > 0 || it.cooking > 0;
        return '' +
          '<div class="matrix-card' + (hasDemand ? ' has-demand' : '') + '">' +
            '<div class="matrix-card-top">' +
              '<span class="matrix-card-name">' + escapeHtml(it.name) + '</span>' +
              '<span class="matrix-card-price">' + fmtMoney(it.price) + '</span>' +
            '</div>' +
            '<div class="matrix-stages-grid">' +
              '<div class="matrix-stage-box"><span class="matrix-stage-lbl">To Grill</span><span class="matrix-stage-val val-placed">' + it.placed + '</span></div>' +
              '<div class="matrix-stage-box"><span class="matrix-stage-lbl">Cooking</span><span class="matrix-stage-val val-cooking">' + it.cooking + '</span></div>' +
              '<div class="matrix-stage-box"><span class="matrix-stage-lbl">Ready</span><span class="matrix-stage-val val-ready">' + it.ready + '</span></div>' +
            '</div>' +
            '<div class="matrix-card-actions">' +
              '<button class="matrix-btn to-grill batch-item-btn" data-item="' + escapeHtml(it.name) + '" data-from="placed" data-to="in_process" ' + (it.placed === 0 ? 'disabled' : '') + '>🔥 Put ' + it.placed + ' on Grill</button>' +
              '<button class="matrix-btn to-ready batch-item-btn" data-item="' + escapeHtml(it.name) + '" data-from="in_process" data-to="cooking_finished" ' + (it.cooking === 0 ? 'disabled' : '') + '>✓ ' + it.cooking + ' Ready</button>' +
            '</div>' +
          '</div>';
      }).join('');
      return '<div class="matrix-cat-section"><div class="matrix-cat-title">' + escapeHtml(cat) + '</div><div style="display:flex;flex-direction:column;gap:8px;">' + cardsHtml + '</div></div>';
    }).join('');

    var ticketsHtml = filteredTickets.length ? filteredTickets.map(function(o){
      var urg = urgencyClass(o.createdAt);
      var itemsList = (o.items || []).map(function(it){
        return '<li><strong>' + it.qty + '×</strong> ' + escapeHtml(it.name) + '</li>';
      }).join('');

      var actionBtn = '';
      if (o.status === 'placed') {
        actionBtn = '<button class="pit-action-btn grill advance-btn" data-order="' + o.id + '" data-next="in_process">🔥 PUT ON GRILL</button>' +
                    '<button class="pit-action-btn back cancel-btn" data-order="' + o.id + '" data-num="' + o.orderNumber + '">Cancel</button>';
      } else if (o.status === 'in_process') {
        actionBtn = '<button class="pit-action-btn ready advance-btn" data-order="' + o.id + '" data-next="cooking_finished">🥩 COOKED / READY TO SERVE</button>' +
                    '<button class="pit-action-btn back advance-btn" data-order="' + o.id + '" data-next="placed">↩ Back</button>';
      } else if (o.status === 'cooking_finished') {
        actionBtn = '<button class="pit-action-btn deliver advance-btn" data-order="' + o.id + '" data-next="delivered">🎉 HAND TO CUSTOMER</button>' +
                    '<button class="pit-action-btn back advance-btn" data-order="' + o.id + '" data-next="in_process">↩ Back</button>';
      }

      return '' +
        '<div class="pit-ticket ' + urg + '">' +
          '<div class="pit-ticket-head">' +
            '<span class="pit-ticket-num">' + tokenLabel(o.orderNumber) + '</span>' +
            '<div class="pit-ticket-meta">' +
              paymentPillHtml(o) +
              '<span class="pit-ticket-time">' + timeAgo(o.createdAt) + '</span>' +
              statusPillHtml(o.status) +
            '</div>' +
          '</div>' +
          '<div class="pit-ticket-cust">' + escapeHtml(o.customerName || 'Walk-in Guest') + '</div>' +
          '<ul class="pit-ticket-items">' + itemsList + '</ul>' +
          (o.notes ? '<div class="pit-ticket-notes">“' + escapeHtml(o.notes) + '”</div>' : '') +
          '<div class="pit-ticket-actions">' + actionBtn + '</div>' +
        '</div>';
    }).join('') : emptyState('No active orders', 'New orders will appear here automatically.');

    var placedCount = activeOrders.filter(function(o){ return o.status === 'placed'; }).length;
    var cookingCount = activeOrders.filter(function(o){ return o.status === 'in_process'; }).length;
    var readyCount = activeOrders.filter(function(o){ return o.status === 'cooking_finished'; }).length;

    view.innerHTML = '' +
      '<div class="pitmaster-page">' +
        '<div class="pit-header">' +
          '<h1 class="pit-title">🔥 Pit Master Command</h1>' +
          '<div class="pit-quick-stats">' +
            '<span class="pit-stat-pill" style="border-color:var(--amber);"><strong style="color:var(--amber);">' + demand.totalPlaced + '</strong> Items to Grill</span>' +
            '<span class="pit-stat-pill" style="border-color:var(--ember);"><strong style="color:var(--ember);">' + demand.totalCooking + '</strong> Items on Grill</span>' +
            '<span class="pit-stat-pill" style="border-color:var(--sage);"><strong style="color:var(--sage);">' + demand.totalReady + '</strong> Ready to Serve</span>' +
          '</div>' +
        '</div>' +
        '<div class="pit-layout">' +
          '<div class="pit-matrix-panel">' +
            '<div class="pit-matrix-title"><strong>Grill Demand Matrix</strong><button class="btn ghost small batch-all-btn" data-from="placed" data-to="in_process" ' + (demand.totalPlaced === 0 ? 'disabled' : '') + '>Put All on Grill</button></div>' +
            matrixGroupsHtml +
          '</div>' +
          '<div class="pit-stream-panel">' +
            '<div class="pit-stream-controls">' +
              '<div class="chips" style="padding-bottom:0;margin-bottom:0;">' +
                '<button class="chip pit-filter-btn' + (pitFilter === 'all' ? ' active' : '') + '" data-filter="all">All Active (' + activeOrders.length + ')</button>' +
                '<button class="chip pit-filter-btn' + (pitFilter === 'placed' ? ' active' : '') + '" data-filter="placed">🔥 Placed (' + placedCount + ')</button>' +
                '<button class="chip pit-filter-btn' + (pitFilter === 'in_process' ? ' active' : '') + '" data-filter="in_process">♨️ Cooking (' + cookingCount + ')</button>' +
                '<button class="chip pit-filter-btn' + (pitFilter === 'cooking_finished' ? ' active' : '') + '" data-filter="cooking_finished">🍽️ Ready (' + readyCount + ')</button>' +
              '</div>' +
              '<input type="search" id="pitSearchInput" class="pit-search" placeholder="Search order #, customer or item…" value="' + escapeHtml(pitSearch) + '" />' +
            '</div>' +
            '<div class="pit-ticket-list">' + ticketsHtml + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    var searchEl = qs('#pitSearchInput');
    if (searchEl) {
      searchEl.addEventListener('input', function(){
        pitSearch = searchEl.value;
        var spTicket = qs('.pit-ticket-list') ? qs('.pit-ticket-list').scrollTop : 0;
        renderPitmasterView();
        if (qs('.pit-ticket-list')) qs('.pit-ticket-list').scrollTop = spTicket;
      });
    }

    window.scrollTo(0, spWin);
  }

  async function onAdvanceClick(orderId, next){
    try { await advanceStatus(orderId, next); }
    catch (e) { console.error(e); showToast('Could not update the order.', true); }
  }
  async function onCancelClick(orderId, orderNum){
    try { await cancelOrderById(orderId, orderNum); }
    catch (e) { console.error(e); showToast('Could not cancel the order.', true); }
  }

  function openCancelledModal(){ renderCancelledModal(); qs('#cancelledModal').classList.add('open'); }
  function closeCancelledModal(){ qs('#cancelledModal').classList.remove('open'); }
  function renderCancelledModal(){
    var list = qs('#cancelledList');
    if (!list) return;
    if (cancelledOrders.length === 0) { list.innerHTML = '<p class="muted">No cancelled orders.</p>'; return; }
    list.innerHTML = cancelledOrders.map(function(o){
      return '' +
        '<div class="cart-row">' +
          '<span class="cart-row-name">' + tokenLabel(o.orderNumber) + ' — ' + escapeHtml(o.customerName || '—') + '</span>' +
          '<button class="btn ghost small advance-btn" data-order="' + o.id + '" data-next="placed">Restore</button>' +
        '</div>';
    }).join('');
  }

  // ---------------- Menu setup view ----------------
  function menuRowHtml(item){
    var available = item.available !== false;
    return '' +
      '<div class="menu-row">' +
        '<div class="menu-row-main"><span class="menu-row-name">' + escapeHtml(item.name) + '</span><span class="menu-row-cat">' + escapeHtml(item.category) + '</span></div>' +
        '<span class="menu-row-price num">' + fmtMoney(item.price) + '</span>' +
        '<label class="switch"><input type="checkbox" class="avail-toggle" data-id="' + item.id + '" ' + (available ? 'checked' : '') + '><span class="switch-track"></span></label>' +
        '<button class="icon-btn edit-item-btn" data-id="' + item.id + '" aria-label="Edit">✎</button>' +
        '<button class="icon-btn danger delete-item-btn" data-id="' + item.id + '" aria-label="Delete">🗑</button>' +
      '</div>';
  }

  function renderMenuView(){
    var spWin = window.scrollY || document.documentElement.scrollTop || 0;
    var view = qs('#view');
    var groups = CATEGORIES.map(function(cat){
      var items = menuItems.filter(function(m){ return m.category === cat; })
        .sort(function(a, b){ return (a.sortOrder || 0) - (b.sortOrder || 0); });
      return '<section class="cat-section"><h2 class="cat-title">' + escapeHtml(cat) + '</h2>' +
        (items.length ? '<div class="menu-list">' + items.map(menuRowHtml).join('') + '</div>' : '<p class="muted">No ' + cat.toLowerCase() + ' yet.</p>') +
        '</section>';
    }).join('');
    view.innerHTML = '' +
      '<div class="menu-page">' +
        '<div class="menu-page-head">' +
          '<h1>Menu setup</h1>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button class="btn ghost seed-default-btn" type="button" title="Load the 12 standard Smoke Signal BBQ items">Load Starter Menu</button>' +
            '<button class="btn primary" id="addItemBtn" type="button">+ Add item</button>' +
          '</div>' +
        '</div>' +
        '<p class="kicker">Changes here update the Order tab for everyone within a few seconds.</p>' +
        (menuItems.length ? groups : emptyState('No menu items yet', 'Load the starter Smoke Signal BBQ menu or create custom items.', '<button class="btn primary seed-default-btn" type="button" style="margin-top:14px;">Load Starter Menu (12 items)</button>')) +
      '</div>';
    var addBtn = qs('#addItemBtn'); if (addBtn) addBtn.addEventListener('click', function(){ openItemModal(null); });
    window.scrollTo(0, spWin);
  }

  function openItemModal(id){
    editingItemId = id || null;
    var item = id ? menuItems.find(function(m){ return m.id === id; }) : null;
    qs('#itemModalTitle').textContent = item ? 'Edit item' : 'Add item';
    qs('#itemNameInput').value = item ? item.name || '' : '';
    qs('#itemTaglineInput').value = item ? item.tagline || '' : '';
    qs('#itemCategoryInput').value = item ? item.category || CATEGORIES[0] : CATEGORIES[0];
    qs('#itemPriceInput').value = item ? (item.price != null ? item.price : '') : '';
    qs('#itemModal').classList.add('open');
    setTimeout(function(){ qs('#itemNameInput').focus(); }, 50);
  }
  function closeItemModal(){ qs('#itemModal').classList.remove('open'); editingItemId = null; }

  async function onSaveItemClick(){
    var name = qs('#itemNameInput').value.trim();
    var tagline = qs('#itemTaglineInput').value.trim();
    var category = qs('#itemCategoryInput').value;
    var price = Number(qs('#itemPriceInput').value);
    if (!name || !price || price <= 0) { showToast('Enter a name and a valid price.', true); return; }
    var btn = qs('#saveItemBtn');
    btn.disabled = true;
    try {
      if (editingItemId) { await updateMenuItem(editingItemId, { name: name, tagline: tagline, category: category, price: price }); }
      else { await addMenuItem({ name: name, tagline: tagline, category: category, price: price }); }
      closeItemModal();
      showToast('Menu saved.');
    } catch (e) { console.error(e); showToast('Could not save — please try again.', true); }
    finally { btn.disabled = false; }
  }

  async function onToggleAvailable(id, checkboxEl){
    var item = menuItems.find(function(m){ return m.id === id; });
    if (!item) { if (checkboxEl) checkboxEl.checked = !checkboxEl.checked; return; }
    try { await updateMenuItem(id, { available: !(item.available !== false) }); }
    catch (e) { console.error(e); showToast('Could not update item.', true); }
  }
  async function onDeleteItemClick(id){
    try { await deleteMenuItemById(id); }
    catch (e) { console.error(e); showToast('Could not delete item.', true); }
  }

  // ---------------- History view ----------------
  var HISTORY_STATUSES = [
    ['All','All'],
    ['placed','Placed'],
    ['in_process','Cooking'],
    ['cooking_finished','Cooking Finished'],
    ['delivered','Delivered'],
    ['cancelled','Cancelled']
  ];
  var STATUS_LABELS = {
    placed: 'Placed',
    in_process: 'Cooking',
    cooking_finished: 'Cooking Finished',
    delivered: 'Delivered',
    cancelled: 'Cancelled'
  };

  function formatDateTime(ts){
    if (!ts) return '';
    var d = new Date(ts);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return sameDay ? timeStr : d.toLocaleDateString([], { day: '2-digit', month: 'short' }) + ' ' + timeStr;
  }

  function statusPillHtml(status){
    var label = STATUS_LABELS[status] || status;
    return '<span class="status-pill pill-' + (status || '').replace('_', '-') + '">' + escapeHtml(label) + '</span>';
  }

  function renderHistoryPage(){
    var view = qs('#view');
    view.innerHTML = '' +
      '<div class="history-page">' +
        '<div class="menu-page-head"><h1>Order history</h1><button class="btn ghost" id="exportCsvBtn" type="button">Export CSV</button></div>' +
        '<div id="historyStats" class="kstats"></div>' +
        '<div class="hist-controls">' +
          '<div id="historyChips" class="chips"></div>' +
          '<input id="historySearchInput" type="search" class="hist-search" placeholder="Search order number or name" />' +
        '</div>' +
        '<div id="historyListContainer"></div>' +
      '</div>';
    var exportBtn = qs('#exportCsvBtn'); if (exportBtn) exportBtn.addEventListener('click', onExportCsvClick);
    var searchInput = qs('#historySearchInput');
    searchInput.value = historySearch;
    searchInput.addEventListener('input', function(){ historySearch = searchInput.value; renderHistoryList(); });
    renderHistoryBody();
  }

  function renderHistoryBody(){
    renderHistoryStats();
    renderHistoryChips();
    renderHistoryList();
  }

  function renderHistoryStats(){
    var el = qs('#historyStats'); if (!el) return;
    var counted = allOrders.filter(function(o){ return o.status !== 'cancelled'; });
    var revenue = counted.reduce(function(s, o){ return s + (o.total || 0); }, 0);
    var itemsSold = counted.reduce(function(s, o){ return s + (o.items || []).reduce(function(s2, it){ return s2 + it.qty; }, 0); }, 0);
    el.innerHTML = '' +
      '<div class="kstat"><strong class="num">' + allOrders.length + '</strong><span>Total orders</span></div>' +
      '<div class="kstat"><strong class="num">' + fmtMoney(revenue) + '</strong><span>Revenue</span></div>' +
      '<div class="kstat"><strong class="num">' + itemsSold + '</strong><span>Items sold</span></div>';
  }

  function renderHistoryChips(){
    var el = qs('#historyChips'); if (!el) return;
    el.innerHTML = HISTORY_STATUSES.map(function(s){
      return '<button class="chip hist-filter-chip' + (historyFilter === s[0] ? ' active' : '') + '" data-status="' + s[0] + '" type="button">' + s[1] + '</button>';
    }).join('');
  }

  function historyRowHtml(o){
    var expanded = !!expandedOrders[o.id];
    var count = (o.items || []).reduce(function(s, it){ return s + it.qty; }, 0);
    var fullItems = (o.items || []).map(function(it){ return '<li>' + it.qty + '× ' + escapeHtml(it.name) + '</li>'; }).join('');
    return '' +
      '<div class="history-row">' +
        '<div class="history-row-head hist-toggle" data-id="' + o.id + '">' +
          '<span class="order-num small">' + tokenLabel(o.orderNumber) + '</span>' +
          '<span class="hist-time">' + formatDateTime(o.createdAt) + '</span>' +
          '<span class="hist-cust">' + escapeHtml(o.customerName || '—') + '</span>' +
          '<span class="hist-items-count muted">' + count + ' item' + (count === 1 ? '' : 's') + '</span>' +
          '<span class="hist-total num">' + fmtMoney(o.total) + '</span>' +
          paymentPillHtml(o) +
          statusPillHtml(o.status) +
        '</div>' +
        (expanded ? '<div class="history-row-body"><ul class="order-items">' + fullItems + '</ul>' + (o.notes ? '<p class="order-notes">“' + escapeHtml(o.notes) + '”</p>' : '') + '<div class="history-row-actions">' + (o.paymentStatus === 'pending' ? '<button class="btn solid small mark-paid-btn" data-order="' + o.id + '" type="button">✓ Mark Paid</button>' : '') + '<button class="btn ghost danger small delete-order-btn" data-order="' + o.id + '" data-num="' + o.orderNumber + '" type="button">🗑 Delete order</button></div></div>' : '') +
      '</div>';
  }

  function renderHistoryList(){
    var el = qs('#historyListContainer'); if (!el) return;
    var spWin = window.scrollY || document.documentElement.scrollTop || 0;
    var q = historySearch.trim().toLowerCase();
    var filtered = allOrders.filter(function(o){
      if (historyFilter !== 'All' && o.status !== historyFilter) return false;
      if (q) {
        var matchesNum = String(o.orderNumber).indexOf(q) >= 0;
        var matchesName = (o.customerName || '').toLowerCase().indexOf(q) >= 0;
        if (!matchesNum && !matchesName) return false;
      }
      return true;
    });
    if (filtered.length === 0) {
      el.innerHTML = emptyState('No orders match', allOrders.length ? 'Try a different filter or search.' : 'Orders will show up here once the first one is placed.');
      window.scrollTo(0, spWin);
      return;
    }
    el.innerHTML = '<div class="history-list">' +
      '<div class="history-row-labels"><span></span><span>Time</span><span>Customer</span><span>Items</span><span>Total</span><span>Payment</span><span>Status</span></div>' +
      filtered.map(historyRowHtml).join('') +
      '</div>';
    window.scrollTo(0, spWin);
  }

  function csvEscape(v){
    var s = String(v == null ? '' : v);
    if (/[",\n]/.test(s)) { s = '"' + s.replace(/"/g, '""') + '"'; }
    return s;
  }
  function buildOrdersCsv(orders){
    var rows = [['Order', 'Placed at', 'Customer', 'Items', 'Total', 'Payment', 'Status', 'Notes']];
    orders.forEach(function(o){
      var itemsStr = (o.items || []).map(function(it){ return it.qty + 'x ' + it.name; }).join('; ');
      rows.push([
        tokenLabel(o.orderNumber),
        new Date(o.createdAt).toLocaleString(),
        o.customerName || '',
        itemsStr,
        o.total,
        (o.paymentStatus === 'pending' ? 'Pending' : 'Paid (BITS Gateway)'),
        STATUS_LABELS[o.status] || o.status,
        o.notes || ''
      ]);
    });
    return rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
  }
  function downloadCsv(filename, csvText){
    var blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function onExportCsvClick(){
    if (allOrders.length === 0) { showToast('No orders to export yet.', true); return; }
    var csv = buildOrdersCsv(allOrders.slice().sort(function(a, b){ return a.createdAt - b.createdAt; }));
    downloadCsv('smoke-signal-bbq-orders.csv', csv);
    showToast('Orders exported.');
  }

  // ---------------- Event wiring ----------------
  function wireStaticEvents(){
    qs('#cartBar').addEventListener('click', openCartModal);
    qs('#closeCartBtn').addEventListener('click', closeCartModal);
    qs('#closeItemModalBtn').addEventListener('click', closeItemModal);
    qs('#closeCancelledBtn').addEventListener('click', closeCancelledModal);
    
    // Checkout & Payment flow
    var goToPayBtn = qs('#goToPaymentBtn');
    if (goToPayBtn) goToPayBtn.addEventListener('click', onGoToPaymentClick);
    var backCartBtn = qs('#backToCartBtn');
    if (backCartBtn) backCartBtn.addEventListener('click', onBackToCartClick);
    var closePayBtn = qs('#closePaymentModalBtn');
    if (closePayBtn) closePayBtn.addEventListener('click', closePaymentModal);
    var confirmPaidBtn = qs('#confirmPaidBtn');
    if (confirmPaidBtn) confirmPaidBtn.addEventListener('click', processOrderCheckout);

    qs('#saveItemBtn').addEventListener('click', onSaveItemClick);
    qsa('.modal-overlay').forEach(function(ov){
      ov.addEventListener('click', function(e){ if (e.target === ov) ov.classList.remove('open'); });
    });

    document.body.addEventListener('click', function(e){
      var seedBtn = e.target.closest('.seed-default-btn');
      if (seedBtn) { onSeedDefaultClick(); return; }

      var markPaidBtn = e.target.closest('.mark-paid-btn');
      if (markPaidBtn) {
        markOrderPaid(markPaidBtn.dataset.order);
        return;
      }

      var batchItem = e.target.closest('.batch-item-btn');
      if (batchItem) {
        batchAdvanceItem(batchItem.dataset.item, batchItem.dataset.from, batchItem.dataset.to);
        return;
      }

      var batchAll = e.target.closest('.batch-all-btn');
      if (batchAll) {
        batchAdvanceAll(batchAll.dataset.from, batchAll.dataset.to);
        return;
      }

      var pitFilterBtn = e.target.closest('.pit-filter-btn');
      if (pitFilterBtn) {
        pitFilter = pitFilterBtn.dataset.filter;
        renderPitmasterView();
        return;
      }

      var chip = e.target.closest('.filter-chip');
      if (chip) { currentFilter = chip.dataset.cat; renderOrderView(); return; }

      var inc = e.target.closest('.inc-btn');
      if (inc) {
        var item = menuItems.find(function(m){ return m.id === inc.dataset.id; });
        if (item) setQty(item, ((cart[item.id] && cart[item.id].qty) || 0) + 1);
        return;
      }
      var dec = e.target.closest('.dec-btn');
      if (dec) {
        var c = cart[dec.dataset.id];
        var item2 = menuItems.find(function(m){ return m.id === dec.dataset.id; }) || (c ? { id: c.id, name: c.name, price: c.price } : null);
        if (item2) setQty(item2, (c ? c.qty : 0) - 1);
        return;
      }
      var adv = e.target.closest('.advance-btn');
      if (adv) { onAdvanceClick(adv.dataset.order, adv.dataset.next); return; }

      var can = e.target.closest('.cancel-btn');
      if (can) { onCancelClick(can.dataset.order, can.dataset.num); return; }

      var edit = e.target.closest('.edit-item-btn');
      if (edit) { openItemModal(edit.dataset.id); return; }

      var del = e.target.closest('.delete-item-btn');
      if (del) { onDeleteItemClick(del.dataset.id); return; }

      var delOrder = e.target.closest('.delete-order-btn');
      if (delOrder) { deleteOrderById(delOrder.dataset.order, delOrder.dataset.num); return; }

      var histChip = e.target.closest('.hist-filter-chip');
      if (histChip) { historyFilter = histChip.dataset.status; renderHistoryChips(); renderHistoryList(); return; }

      var histToggle = e.target.closest('.hist-toggle');
      if (histToggle) { var hid = histToggle.dataset.id; expandedOrders[hid] = !expandedOrders[hid]; renderHistoryList(); return; }
    });

    document.body.addEventListener('change', function(e){
      var t = e.target.closest('.avail-toggle');
      if (t) onToggleAvailable(t.dataset.id, t);
    });
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
